version: 2.1

orbs:
  python: circleci/python@2

executors:
  docker-executor:
    docker:
      - image: circleci/python:3.9
    resource_class: large

jobs:
  test-python:
    docker:
      - image: cimg/python:3.8-node
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install pytest
      - run:
          name: Run tests
          command: pytest --junitxml=junit.xml || ((($? == 5)) && echo 'Did not find any tests to run.')
      - store_test_results:
          path: junit.xml

  build-and-push-docker:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - setup_remote_docker  # ❌ Removed "version" field
      - run:
          name: Build Docker Image
          command: docker build -t meesum3595/devsecops-app .
      - run:
          name: Debug Docker Login
          command: |
            echo "Username: $DOCKERHUB_USERNAME"
            echo "Password Length: ${#DOCKERHUB_PASSWORD}"
      - run:
          name: Log in to Docker Hub
          command: echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Push Docker Image
          command: docker push meesum3595/devsecops-app
      - run:
          name: Log out from Docker Hub
          command: docker logout

workflows:
  build-test-deploy:
    jobs:
      - test-python
      - build-and-push-docker:
          requires:
            - test-python
